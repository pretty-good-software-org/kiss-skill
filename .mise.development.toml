# Development profile — additional tools for local work
[tools]
"github:pretty-good-software-org/skillctl" = "2.1.0"
lefthook = "2.1.14"
gitleaks = "8.30.0"
# orgctl releases since v0.9.0 carry no GitHub artifact attestations because the
# organization plan rejects them for private repositories; its locked checksums
# are the deliberate provenance exception for this tool.
"github:pretty-good-software-org/orgctl" = "0.12.2"

[settings]
experimental = true

[hooks]
enter = '[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" ] && lefthook install'
