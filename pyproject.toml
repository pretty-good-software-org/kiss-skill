[project]
name = "template-agent-skill"
version = "0.1.0-alpha.1"
description = "Template for standalone Agent Skill plugin repositories with locked Python tooling, validation, and tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "exceptiongroup>=1.2.2; python_version < '3.11'",
  "tomli>=2.0; python_version < '3.11'",
  "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
