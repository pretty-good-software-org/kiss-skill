# APM package metadata for reproducible installation and audit.
# The standard skills/<name>/SKILL.md layout is auto-detected by APM.
name: kiss
version: 1.0.0
description: >-
  Close a decision that has several valid options by picking the smallest option that meets the actual requirement,
  writing the decision into the decision doc or ticket, and parking every non-essential refinement as an explicit
  to-refine-later item. Use when: a decision has several valid options, a design or process discussion keeps growing, or
  an open decision needs to be closed. Triggers: KISS, keep it simple, simplest option, smallest option, lock the
  decision, park the rest.

# APM producer metadata. `apm pack --force` generates .claude-plugin/plugin.json.
author:
  name: pretty-good-software-org
target: claude
